# Task 003 — first real Gecko build experiment, Linux x64.
# EXPERIMENTAL feasibility build of unmodified, unbranded Firefox source.
# Runs on a standard GitHub-hosted runner (free for public repositories).
# No paid runners, no third-party compute. Nothing here is a release.
name: Gecko build experiment (Linux x64)

on:
  push:
    branches: ["claude/task-003-gecko-build"]
    # Start (or re-run) only by touching the trigger file, so edits to shared
    # scripts never queue an accidental multi-hour build.
    paths: ["engine/gecko/triggers/linux.txt"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gecko-build-linux
  cancel-in-progress: false

env:
  FIREFOX_VERSION: "161.0"          # tag FIREFOX_161_0_RELEASE
  SCCACHE_GHA_ENABLED: "true"
  MOZBUILD_STATE_PATH: ${{ github.workspace }}/../.mozbuild
  METRICS: ${{ github.workspace }}/../metrics

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 355            # GitHub limit is 360 min per job
    steps:
      - uses: actions/checkout@v4

      - name: Start resource monitor
        run: |
          mkdir -p "$METRICS"
          nohup engine/gecko/monitor.sh "$METRICS/resources.csv" / >/dev/null 2>&1 &
          echo $! > "$METRICS/monitor.pid"
          df -h / | tee "$METRICS/disk-initial.txt"
          nproc; free -g

      - name: Free disk (remove unused preinstalled toolchains in this VM)
        run: |
          engine/gecko/step.sh "$METRICS/timings.csv" free_disk bash -c '
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
              /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
            sudo docker image prune --all --force >/dev/null'
          df -h / | tee "$METRICS/disk-after-cleanup.txt"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and verify Firefox source
        id: src
        run: engine/gecko/step.sh "$METRICS/timings.csv" fetch_verify_unpack engine/gecko/fetch-source.sh "$FIREFOX_VERSION" "$GITHUB_WORKSPACE/.."

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Configure (bootstraps pinned upstream toolchains)
        working-directory: ${{ steps.src.outputs.srcdir }}
        run: |
          cp "$GITHUB_WORKSPACE/engine/gecko/mozconfig.linux-x64" mozconfig
          export MOZCONFIG="$PWD/mozconfig"
          "$GITHUB_WORKSPACE/engine/gecko/step.sh" "$METRICS/timings.csv" configure ./mach --no-interactive configure 2>&1 | tee "$METRICS/configure.log"
          test "${PIPESTATUS[0]}" = 0

      - name: Compile
        id: compile
        continue-on-error: true
        working-directory: ${{ steps.src.outputs.srcdir }}
        run: |
          export MOZCONFIG="$PWD/mozconfig"
          # Leave time for logs, sccache stats and artifact upload if the
          # compile runs long; sccache keeps finished objects for a resumed run.
          set +e
          "$GITHUB_WORKSPACE/engine/gecko/step.sh" "$METRICS/timings.csv" compile \
            timeout 290m ./mach --no-interactive build > "$METRICS/build.log" 2>&1
          RC=$?
          tail -n 150 "$METRICS/build.log"
          gzip -k "$METRICS/build.log" && rm "$METRICS/build.log"
          echo "compile exit code: $RC (124 = hit the 290 min timeout)"
          exit $RC

      - name: Package
        id: pkg
        if: steps.compile.outcome == 'success'
        working-directory: ${{ steps.src.outputs.srcdir }}
        run: |
          export MOZCONFIG="$PWD/mozconfig"
          "$GITHUB_WORKSPACE/engine/gecko/step.sh" "$METRICS/timings.csv" package ./mach --no-interactive package 2>&1 | tail -n 300 > "$METRICS/package.log"
          PKG=$(ls ../obj-brizo/dist/firefox-*.tar.* | head -1)
          mkdir -p "$GITHUB_WORKSPACE/../out"
          OUT="$GITHUB_WORKSPACE/../out/brizo-gecko-experiment-${FIREFOX_VERSION}-linux-x86_64.tar.${PKG##*.tar.}"
          cp "$PKG" "$OUT"
          (cd "$(dirname "$OUT")" && sha256sum "$(basename "$OUT")" > SHA256SUMS.txt && cat SHA256SUMS.txt)
          echo "pkg=$OUT" >> "$GITHUB_OUTPUT"

      - name: Smoke test (headless, packaged build)
        if: steps.pkg.outcome == 'success'
        continue-on-error: true
        run: |
          pip install --quiet "websockets==15.0.1"
          mkdir -p /tmp/brizo-app && tar -xf "${{ steps.pkg.outputs.pkg }}" -C /tmp/brizo-app
          engine/gecko/step.sh "$METRICS/timings.csv" smoke_test python engine/gecko/smoke_test.py /tmp/brizo-app/firefox/firefox "$METRICS/smoke"

      - name: Summarise measurements
        if: always()
        run: |
          kill "$(cat "$METRICS/monitor.pid")" || true
          sccache --show-stats > "$METRICS/sccache-stats.txt" 2>&1 || true
          du -sh ../obj-brizo "$MOZBUILD_STATE_PATH" 2>/dev/null | tee "$METRICS/dir-sizes.txt" || true
          df -h / | tee "$METRICS/disk-final.txt"
          PKG="${{ steps.pkg.outputs.pkg }}"
          python - <<PY
          import json, os
          pkg = "$PKG"
          d = {"firefox_version": os.environ["FIREFOX_VERSION"], "runner": "ubuntu-latest",
               "image": os.environ.get("ImageOS"), "image_version": os.environ.get("ImageVersion"),
               "source_sha256": "${{ steps.src.outputs.source_sha256 }}",
               "compile_outcome": "${{ steps.compile.outcome }}"}
          if pkg and os.path.exists(pkg):
              d["package"] = os.path.basename(pkg); d["package_bytes"] = os.path.getsize(pkg)
              d["package_sha256"] = open(os.path.join(os.path.dirname(pkg), "SHA256SUMS.txt")).read().split()[0]
          json.dump(d, open(os.path.join(os.environ["METRICS"], "env.json"), "w"), indent=2)
          PY
          python engine/gecko/summarize.py "$METRICS"

      - name: Upload metrics and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gecko-linux-x64-metrics
          path: ${{ env.METRICS }}
          retention-days: 30

      - name: Upload experimental build
        if: steps.pkg.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: brizo-gecko-experiment-${{ env.FIREFOX_VERSION }}-linux-x86_64
          path: ${{ github.workspace }}/../out
          retention-days: 30
          compression-level: 0
