<!doctype html>
<!--
  Brizo website — reference Sun/Moon theme toggle (NOT deployed; design reference only).
  Requirements covered: instant full-page switch, system preference detection,
  persisted user choice, keyboard accessibility, reduced motion, no framework.
  Documented in docs/website/THEME_TOGGLE.md. Tested by scripts/brand/test-theme-toggle.cjs.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Brizo theme toggle reference</title>
<script>
  // Runs before first paint so there is no flash of the wrong theme.
  (function () {
    var t = null;
    try { t = localStorage.getItem('brizo-theme'); } catch (e) {}
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<style>
  :root {
    --bg: #F4F8FC; --raised: #FFFFFF; --border: #D8E5F3; --text: #0F172A; --muted: #475569;
    --accent: #1684D1; --link: #174EA4; color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0B1220; --raised: #111A2E; --border: #1E2B44; --text: #FFFFFF; --muted: #A9B8CC;
      --accent: #1684D1; --link: #6FBCEB; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0B1220; --raised: #111A2E; --border: #1E2B44; --text: #FFFFFF; --muted: #A9B8CC;
    --accent: #1684D1; --link: #6FBCEB; color-scheme: dark;
  }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 Inter, system-ui, sans-serif; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 16px max(16px, 4vw); border-bottom: 1px solid var(--border); }
  main { padding: 32px max(16px, 4vw); max-width: 65ch; }
  a { color: var(--link); }

  .theme-toggle {
    inline-size: 32px; block-size: 32px; display: inline-grid; place-items: center;
    border: 1px solid var(--border); border-radius: 8px; background: var(--raised); color: var(--accent);
    cursor: pointer; padding: 0;
  }
  .theme-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .theme-toggle svg { inline-size: 16px; block-size: 16px; transition: transform .25s ease; }
  .theme-toggle .moon { display: none; }
  /* Show the icon for the theme you would switch TO. */
  :root[data-effective="light"] .theme-toggle .sun { display: none; }
  :root[data-effective="light"] .theme-toggle .moon { display: block; }
  .theme-toggle:active svg { transform: rotate(-20deg); }
  .reset { font-size: 13px; margin-inline-start: 8px; }
  @media (prefers-reduced-motion: reduce) { .theme-toggle svg { transition: none; } .theme-toggle:active svg { transform: none; } }
  .sr-only { position: absolute; inline-size: 1px; block-size: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<header>
  <strong>Brizo</strong>
  <span>
    <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch to dark theme">
      <svg class="sun" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3.3" fill="currentColor"/><path d="M13.4 8L15.2 8M11.82 11.82L13.09 13.09M8 13.4L8 15.2M4.18 11.82L2.91 13.09M2.6 8L.8 8M4.18 4.18L2.91 2.91M8 2.6L8 .8M11.82 4.18L13.09 2.91" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <svg class="moon" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M10.9 1.3A6.8 6.8 0 1 0 14.7 11 5.6 5.6 0 0 1 10.9 1.3Z"/></svg>
    </button>
    <button type="button" class="reset" id="theme-reset" hidden>Use system setting</button>
  </span>
  <span class="sr-only" role="status" aria-live="polite" id="theme-status"></span>
</header>
<main>
  <h1>Theme toggle reference</h1>
  <p>Click the Sun/Moon button, or press Tab then Enter or Space. Your choice is saved in this browser. Without a saved choice the page follows your operating system.</p>
  <p><a href="#">Example link</a></p>
</main>
<script>
(function () {
  var root = document.documentElement;
  var btn = document.getElementById('theme-toggle');
  var reset = document.getElementById('theme-reset');
  var status = document.getElementById('theme-status');
  var mq = window.matchMedia('(prefers-color-scheme: dark)');

  function saved() { try { return localStorage.getItem('brizo-theme'); } catch (e) { return null; } }
  function save(v) { try { v ? localStorage.setItem('brizo-theme', v) : localStorage.removeItem('brizo-theme'); } catch (e) {} }
  function effective() { var s = saved(); return s === 'light' || s === 'dark' ? s : (mq.matches ? 'dark' : 'light'); }

  function render() {
    var e = effective(), s = saved();
    root.setAttribute('data-effective', e);
    if (s) root.setAttribute('data-theme', s); else root.removeAttribute('data-theme');
    var next = e === 'dark' ? 'light' : 'dark';
    btn.setAttribute('aria-label', 'Switch to ' + next + ' theme');
    btn.title = 'Switch to ' + next + ' theme';
    reset.hidden = !s;
  }

  btn.addEventListener('click', function () {
    var next = effective() === 'dark' ? 'light' : 'dark';
    save(next); render();
    status.textContent = next.charAt(0).toUpperCase() + next.slice(1) + ' theme on';
  });
  reset.addEventListener('click', function () {
    save(null); render(); status.textContent = 'Following system setting'; btn.focus();
  });
  // Follow live OS changes while the user has no saved choice.
  (mq.addEventListener ? mq.addEventListener('change', render) : mq.addListener(render));
  // Keep several open tabs in sync.
  window.addEventListener('storage', function (ev) { if (ev.key === 'brizo-theme') render(); });
  render();
})();
</script>
</body>
</html>
